<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBB9Jdg4J_onUAR2rFieAAnyf29plxNWVo",
        authDomain: "napataelhaya.firebaseapp.com",
        projectId: "napataelhaya",
        storageBucket: "napataelhaya.firebasestorage.app",
        messagingSenderId: "4297790604",
        appId: "1:4297790604:web:df023add20dfc543e5d7a9",
        measurementId: "G-8X853PE60X"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadCertificates() {
        const container = document.getElementById('certificatesContainer');

        try {
            const q = query(
                collection(db, 'certificates'),
                orderBy('createdAt', 'desc')
            );

            const snap = await getDocs(q);
            
            if (snap.empty) {
                container.innerHTML = '<div style="text-align: center; color: #333; padding: 20px;">لا توجد شهادات حالياً.</div>';
                return;
            }
            
            container.innerHTML = '';

            snap.forEach(docSnap => {
                const cert = docSnap.data();
                
                const div = document.createElement('div');
                div.className = 'certificate-item';

                div.innerHTML = `
                    <img 
                        src="${cert.image}" 
                        alt="شهادة" 
                        class="certificate-image"
                    >
                `;

                container.appendChild(div);
            });

        } catch (e) {
            console.error("خطأ في تحميل الشهادات:", e);

            container.innerHTML = '<div style="text-align: center; color: #333; padding: 20px;">حدث خطأ في تحميل الشهادات.</div>';
        }
    }

    document.addEventListener('DOMContentLoaded', loadCertificates);
</script>
