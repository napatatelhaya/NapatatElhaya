            <ul id="navMenu">
                <!-- ملاحظة: عدل الروابط في كل صفحة لتناسب الصفحة الحالية (active) -->
                <li><a href="index.html">الرئيسية</a></li>

                    <a href="products.html" class="dropdown-toggle">منتجاتنا <i class="bi bi-chevron-down"></i></a>
                    <ul class="dropdown-menu">
                        <li><a href="products.html?category=herbs">أعشاب</a></li>
                        <li><a href="products.html?category=spices">توابل</a></li>

                <!-- زر اللغة الموحد -->
                <li>
    <a href="product-detail-en.html" id="langSwitcher" class="lang-btn" onclick="this.href = this.href + window.location.search;">

</li>

    </div>
</header>
    <section class="product-detail-hero">
        <div class="hero-content">
            <span class="hero-tag fade-up">✦ تفاصيل المنتج ✦</span>
            <h1 id="productTitle" class="fade-up fade-up-delay-1">جاري التحميل...</h1>
        </div>
    </section>

    <div class="product-detail-container">
        <div class="product-detail-grid">
            <div class="product-detail-image fade-up">
                <img id="productImage" src="" alt="صورة المنتج">
            </div>
            
            <div class="product-detail-info fade-up fade-up-delay-2">
                <span id="productCategory" class="product-detail-category">-</span>
                <h1 id="productName">-</h1>
                <p id="productDescription" class="product-detail-description">-</p>
                
                <div class="product-detail-origin">
                    <i class="bi bi-geo-alt-fill"></i>
                    <span>المنشأ: <strong>مصر</strong></span>
                </div>
                
                <div class="product-detail-actions">
                    <a id="whatsappLink" href="#" class="btn btn-primary" target="_blank">
                        <i class="bi bi-whatsapp ms-2"></i> استفسر عبر واتساب
                    </a>
                    <a href="products.html" class="btn btn-outline" style="color: var(--green-dark); border-color: var(--green-dark);">
                        <i class="bi bi-arrow-right ms-2"></i> العودة للمنتجات
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>© 2026 نباتات الحياة للتصدير. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <a href="https://wa.me/201067131398" class="whatsapp-float" target="_blank" rel="noopener noreferrer">
        <i class="bi bi-whatsapp"></i>
    </a>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDTZfOOSxaWFlAc_smFxGKb3Sv3HH8tEAw",
            authDomain: "napatatelhaya-98cb9.firebaseapp.com",
            projectId: "napatatelhaya-98cb9",
            storageBucket: "napatatelhaya-98cb9.firebasestorage.app",
            messagingSenderId: "794316862369",
            appId: "1:794316862369:web:592fF5ce4e867c97bc91e0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const docId = urlParams.get('id');

        if (!docId) {
            window.location.href = 'products.html';
        }

        async function loadProduct() {
            try {
                const productRef = doc(db, "products", docId);
                const productSnap = await getDoc(productRef);

                if (productSnap.exists()) {
                    const product = productSnap.data();
                    
                    document.getElementById('productTitle').textContent = product.name.ar;
                    document.getElementById('productName').textContent = product.name.ar;
                    document.getElementById('productImage').src = product.image;
                    document.getElementById('productDescription').textContent = product.description.ar;
                    
                    const categories = { 'herbs': 'أعشاب', 'spices': 'توابل', 'seeds': 'بذور' };
                    document.getElementById('productCategory').textContent = categories[product.category] || product.category;
                    
                    const whatsappMsg = `أريد الاستفسار عن منتج: ${product.name.ar}`;
                    document.getElementById('whatsappLink').href = `https://wa.me/201067131398?text=${encodeURIComponent(whatsappMsg)}`;
                    
                    document.title = `${product.name.ar} | نباتات الحياة`;
                } else {
                    window.location.href = 'products.html';
                }
            } catch (error) {
                console.error("Error loading product:", error);
                window.location.href = 'products.html';
            }
        }

        loadProduct();
    </script>

<script type="module" src="js/main.js"></script>
</body>
</html>
