<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج | نباتات الحياة</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header id="mainHeader">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <div class="logo-icon"><i class="bi bi-tree-fill"></i></div>
                <div class="logo-text">نباتات <span>الحياة</span></div>
            </a>
            <div class="mobile-toggle" id="mobileToggle">
                <span></span><span></span><span></span>
            </div>
            <nav id="mainNav">
                <ul id="navMenu">
                    <li><a href="index.html">الرئيسية</a></li>
                    <li class="dropdown">
                        <a href="products.html" class="dropdown-toggle">منتجاتنا <i class="bi bi-chevron-down"></i></a>
                        <ul class="dropdown-menu">
                            <li><a href="products.html?category=herbs">أعشاب</a></li>
                            <li><a href="products.html?category=spices">توابل</a></li>
                            <li><a href="products.html?category=seeds">بذور</a></li>
                        </ul>
                    </li>
                    <li><a href="about.html">من نحن</a></li>
                    <li><a href="contact.html">اتصل بنا</a></li>
                    <li><a href="#" id="langSwitcher" class="lang-btn"><i class="bi bi-globe"></i> <span id="langText">EN</span></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="product-detail-hero">
        <div class="hero-content">
            <span class="hero-tag fade-up">✦ تفاصيل المنتج ✦</span>
            <h1 id="productTitle" class="fade-up fade-up-delay-1">جاري التحميل...</h1>
        </div>
    </section>

    <div class="product-detail-container">
        <div class="product-detail-grid">
            <div class="product-detail-image fade-up">
                <img id="productImage" src="" alt="صورة المنتج">
            </div>
            
            <div class="product-detail-info fade-up fade-up-delay-2">
                <span id="productCategory" class="product-detail-category">-</span>
                <h1 id="productName">-</h1>
                <p id="productDescription" class="product-detail-description">-</p>
                
                <div class="product-detail-origin">
                    <i class="bi bi-geo-alt-fill"></i>
                    <span>المنشأ: <strong>مصر</strong></span>
                </div>
                
                <div class="product-detail-actions">
                    <a id="whatsappLink" href="#" class="btn btn-primary" target="_blank">
                        <i class="bi bi-whatsapp ms-2"></i> استفسر عبر واتساب
                    </a>
                    <a href="products.html" class="btn btn-outline" style="color: var(--green-dark); border-color: var(--green-dark);">
                        <i class="bi bi-arrow-right ms-2"></i> العودة للمنتجات
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>© 2026 نباتات الحياة للتصدير. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <a href="https://wa.me/201067131398" class="whatsapp-float" target="_blank" rel="noopener noreferrer">
        <i class="bi bi-whatsapp"></i>
    </a>

    <!-- ✅ تم الإصلاح: إضافة type="module" -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBB9Jdg4J_onUAR2rFieAAnyf29plxNWVo",
            authDomain: "napataelhaya.firebaseapp.com",
            projectId: "napataelhaya",
            storageBucket: "napataelhaya.firebasestorage.app",
            messagingSenderId: "4297790604",
            appId: "1:4297790604:web:df023add20dfc543e5d7a9",
            measurementId: "G-8X853PE60X"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const docId = urlParams.get('id');

        console.log("🔍 معرف المنتج:", docId);

        if (!docId) {
            window.location.href = 'products.html';
        }

        async function loadProduct() {
            try {
                const productRef = doc(db, "products", docId);
                const productSnap = await getDoc(productRef);

                if (productSnap.exists()) {
                    const product = productSnap.data();
                    console.log("✅ بيانات المنتج:", product);
                    
                    document.getElementById('productTitle').textContent = product.name.ar;
                    document.getElementById('productName').textContent = product.name.ar;
                    document.getElementById('productImage').src = product.image;
                    document.getElementById('productDescription').textContent = product.description.ar;
                    
                    const categories = { 'herbs': 'أعشاب', 'spices': 'توابل', 'seeds': 'بذور' };
                    document.getElementById('productCategory').textContent = categories[product.category] || product.category;
                    
                    const whatsappMsg = `أريد الاستفسار عن منتج: ${product.name.ar}`;
                    document.getElementById('whatsappLink').href = `https://wa.me/201067131398?text=${encodeURIComponent(whatsappMsg)}`;
                    
                    document.title = `${product.name.ar} | نباتات الحياة`;
                } else {
                    console.error("❌ المنتج غير موجود");
                    window.location.href = 'products.html';
                }
            } catch (error) {
                console.error(" خطأ في جلب المنتج:", error);
                window.location.href = 'products.html';
            }
        }

        loadProduct();
    </script>

    <!-- ✅ تم الإصلاح: إضافة type="module" -->
    <script type="module" src="js/main.js"></script>
    
    <script>
        // سكريبت تبديل اللغة الذكي
        document.addEventListener('DOMContentLoaded', () => {
            const langSwitcher = document.getElementById('langSwitcher');
            if (langSwitcher) {
                const currentUrl = new URL(window.location.href);
                let newPath = currentUrl.pathname.replace('product-detail.html', 'product-detail-en.html');
                const newUrl = new URL(newPath, currentUrl.origin);
                newUrl.search = currentUrl.search;
                langSwitcher.href = newUrl.toString();
            }
        });
    </script>
</body>
</html>
